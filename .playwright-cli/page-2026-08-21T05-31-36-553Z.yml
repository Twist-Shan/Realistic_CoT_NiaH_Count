        - paragraph [ref=e749]: 数据支持“P0 commit + grammar-conditioned retrieval query + bank-level necessity”的功能分解。P2 的作用目前只能称为更干净的 marker-conditioned localization site：因为 ablation 从 P0 已开始，我们知道这组 heads 从 transition 开始不可用会造成损害；但没有分离式 QK/OV patching 来证明 P0 专门读取、P2 专门写入。
        - generic [ref=e750]:
          - generic [ref=e751]: 尚未证明
          - text: 没有证明 selected bank 是唯一通路、每个 head 单独必要、progress state 必须经由这些 heads 传递，也没有用 restoration 把被破坏的 needle retrieval 救回。Representation、attention localization 与 causal necessity 已在同一报告对齐，但仍是三种不同 estimand。
        - generic [ref=e752]:
          - generic [ref=e753]: 当前总论
          - text: Native-thinking 模型在 item commits 与 answer query 上形成可解码的计数相关状态，并调用依赖 surface grammar 与 query stage 的 targeted-retrieval head banks。Gemma 回路窄、早期即显效；Qwen 回路宽，且 marker-first grammar 的 P2 ranking 是获得强因果效应的关键。

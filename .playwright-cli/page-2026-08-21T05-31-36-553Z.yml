      - generic [ref=e147]:
        - generic [ref=e148]: Estimands
        - heading "2 · 三层证据分别如何计算" [level=2] [ref=e149]
        - heading "2.1 Representation" [level=3] [ref=e150]
        - paragraph [ref=e151]: Discovery 内拟合 StandardScaler 与 whitened PCA-16，再以 seed-grouped out-of-fold Logistic/NCC 选层；confirmation 只在冻结层上评估。Balanced accuracy 对十个 count/index 类等权：
        - generic [ref=e152]: BA = (1 / C) · Σ_c TP_c / (TP_c + FN_c) SNR_dB = 10 · log10(signal power / within-class noise power)
        - paragraph [ref=e153]: BA 高说明类别可解码；SNR 为负只说明 within-class variation 仍大于 centroid 间能量，不能解释为“没有 counter”。
        - heading "2.2 Targeted-retrieval attention score" [level=3] [ref=e154]
        - paragraph [ref=e155]: 对 grammar g，在每个 discovery seed 内先平均所有 eligible transition events，再对 seeds 等权。event 基础量是 head 从 query 指向 next needle 完整 prompt-record span 的 raw attention mass：
        - generic [ref=e156]: "S_g(ℓ,h) = (1 / |D_g|) Σ_{s∈D_g} (1 / |E_{s,g}|) Σ_{e∈E_{s,g}} Σ_{t∈R(target(e))} A_{ℓ,h}(q_e,t)"
        - paragraph [ref=e157]:
          - text: 这样 event 更多的 seed 不会获得更高权重。
          - code [ref=e158]: all
          - text: atlas 同样先在 seed 内平均全部 eligible events，再对 discovery seeds 等权；它是描述性共同排序，不替代 grammar-specific bank。
        - heading "2.3 Causal endpoint 与对照" [level=3] [ref=e159]
        - paragraph [ref=e160]: 对每个 registered anchor 自由生成，读取 ablation 后出现的第一个 semantic city。若它不等于 registry 中 next needle city，则计一次 failure。主描述量为：
        - generic [ref=e161]: Δ_failure(K) = selected-bank failure(K) − pooled random-control failure(K)
        - paragraph [ref=e162]: Qwen K32–112 使用三个 layer-matched random banks，K128 因容量限制使用三个 global same-K banks；Gemma K1/2/4/6/8 均使用三个 layer-matched random banks。Confirmation 少于 10 anchors 的 grammar 标为 exploratory。
        - generic [ref=e163]:
          - generic [ref=e164]: 本节结论
          - text: 高 attention score 只提供定位；只有 selected failure 显著高于同规模 random damage，才支持 selection-specific causal necessity。本页的最终 hybrid 合并目前报告注册的 failure rates，未把旧 P0 bootstrap CI 冒充为新 hybrid 的置信区间。

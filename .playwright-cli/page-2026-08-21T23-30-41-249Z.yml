      - paragraph [ref=f3e3623]: 三张 map 都由 discovery seeds 内先平均 events、再等权平均 seeds 得到；相同 head 可以跨 grammar 或跨推理模式重现，但 bank 不强制共享。它们仍然只是 frozen localization：是否为自然 computation 所需，由后面的 confirmation ablation 判定。
      - generic [ref=f3e3624]:
        - strong [ref=f3e3625]: 3.2 目前结论。
        - text: P0 raw attention 提供统一、可解释的起点；正式 bank 则需要 grammar-specific query 与 metric。Qwen 的两个主要新增 grammar 都在 city-pre 附近局部化，但 adjacent-after 更适合 OV-write score、same-unit-before 更适合 raw mass；Gemma adjacent-after 则在 exact P0 上由 raw target mass 冻结成窄 Top-8 bank。
      - heading "3.3 Non-thinking broad bank 与 Native-thinking 正式 causal bank 是否复用相同 heads" [level=3] [ref=f3e3626]
      - generic [ref=f3e3627]:
        - generic [ref=f3e3628]: Purpose
        - paragraph [ref=f3e3629]:
          - strong [ref=f3e3630]: 目的。
          - text: 检验两种推理模式是否完全重建不同的 retrieval circuit，还是会在同一模型坐标中复用一部分 layer-head。这里的 Native 集合只使用进入正式 selected-vs-random ablation 的 causal banks，不使用图 2 的 P0 atlas 可视化 bank。
          - generic [ref=f3e3631]:
            - strong [ref=f3e3632]: 直观例子：
            - text: 若 Non-thinking broad Top-32 中有 20 枚也进入某个 Native Top-128，而随机 Top-128 预期只覆盖约 3.56 枚 broad heads，则存在明显的跨模式 head preference；共同 heads 的 Top-K Spearman 再判断两套 ranking 是否把这些 heads 排成相近次序。
      - generic [ref=f3e3633]:
        - strong [ref=f3e3634]: Membership 与 rank agreement 分开计算。
        - text: 令 A 为 Non-thinking frozen broad bank，B 为进入正式 ablation 的 Native grammar-specific causal bank，U 为该模型全部 layer-head universe。Intersection=|A∩B|；Jaccard=|A∩B|/|A∪B|；random E[|A∩B|]=|A||B|/|U|；enrichment=|A∩B|/E。Top-K Spearman 只在共同 heads H=A∩B 上计算：分别按每枚 head 在完整 Non-thinking 与正式 Native discovery ranking 中的顺序，对 H 内部重新编号，再计算 ρ
        - subscript [ref=f3e3635]: shared
        - text: =corr(rank
        - subscript [ref=f3e3636]: A
        - text: ",rank"
        - subscript [ref=f3e3637]: B
        - text: )。因此 overlap 回答“是否选中同一批 heads”，ρ
        - subscript [ref=f3e3638]: shared
        - text: 回答“共同 heads 是否被相似排序”；不同模式的 raw score 尺度不同，不直接做分数相关。没有单一 ranking 的 bank 并集不定义 Spearman。单侧 overlap p 值来自 exact hypergeometric test。
      - figure "横轴为 Non-thinking broad bank 被正式 Native causal bank 覆盖的比例；绿色=observed，灰色=random expectation |B|/|U|。Qwen broad=Top-32、每个主要 Native grammar=Top-128、universe=36×32=1152；“either major grammar”使用两个 Top-128 的并集（152 unique heads），只作 membership 汇总，因此没有单一 Top-K Spearman。Gemma broad=Top-8、正式 Native adjacent-after=Top-8、universe=42×8=336。图 2 的 Qwen P0 Top-128 与 Gemma Top-6 只用于 atlas 展示，不进入本比较。" [ref=f3e3639]:

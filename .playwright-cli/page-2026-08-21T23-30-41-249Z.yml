      - heading "3. Step 2 · Targeted retrieval：从 target attention mass 到冻结因果 bank" [level=2] [ref=f3e259]
      - paragraph [ref=f3e260]:
        - text: 这一节完全对齐 Non-thinking 的 Broad retrieval 判定顺序：
        - strong [ref=f3e261]: 先看 routing，再冻结 selection，最后做 matched ablation
        - text: 。不同点是，Native-thinking 不是在一个最终 answer query 上同时聚合所有 needles，而是在每次 transition k→k+1 中定向读取下一条 record；因此基础量从 broad coverage score 改为正确 next-record 的 target mass。
      - generic [ref=f3e262]:
        - strong [ref=f3e263]: Stage-II hypothesis。
        - text: 当 trace 已完成 item k，某些 attention heads 会在 grammar-conditioned query 上优先指向 prompt 中第 k+1 条 needle record，并把读到的内容送入下一条 city 的生成。Attention heatmap 只描述“看向哪里”；只有 frozen selected bank 相对 matched random bank 的 confirmation failure contrast 才支持自然行为依赖。
